name: Keepalive (60-day inactivity guard)

# 목적:
#  GitHub은 저장소에 60일간 "사용자 활동"이 없으면 모든 scheduled workflow를
#  자동으로 비활성화한다. github-actions[bot] 커밋(예: update_cost_basis)은
#  활동으로 인정되지 않는다. 이 워크플로우는 PAT로 실제 사용자 커밋을 남겨
#  60일 시계를 매달 리셋하고, 혹시 이미 꺼진 워크플로우가 있으면 다시 켠다.
#
# 사전 준비 (1회):
#  1) PAT(classic) 발급 — scope: repo + workflow, 만료 No expiration
#  2) 저장소 → Settings → Secrets and variables → Actions
#     → New repository secret → Name: KEEPALIVE_PAT
#  3) 이 파일을 .github/workflows/keepalive.yml 로 커밋
#  4) Actions → Keepalive → Run workflow 로 1회 수동 실행

on:
  schedule:
    # 매월 1일과 15일 12:00 UTC. 두 번 도는 이유는 한 번 실패해도
    # 60일 안에 반드시 한 번은 성공하게 하기 위함.
    - cron: '0 12 1,15 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      PAT: ${{ secrets.KEEPALIVE_PAT }}

    steps:
      # ── 0. 시크릿부터 확인. 없으면 여기서 명확하게 멈춘다 ──────────────
      - name: KEEPALIVE_PAT 시크릿 확인
        run: |
          if [ -z "${PAT}" ]; then
            echo "::error::KEEPALIVE_PAT 시크릿이 비어 있습니다."
            echo ""
            echo "확인할 것:"
            echo "  1) 저장소 Settings → Secrets and variables → Actions 에"
            echo "     이름이 정확히 'KEEPALIVE_PAT' 인 항목이 있는가"
            echo "     (대소문자·밑줄까지 일치해야 함. 앞뒤 공백 주의)"
            echo "  2) 'Environment secrets'가 아니라 'Repository secrets' 쪽에 있는가"
            echo "  3) timesave7/Dean-Automation 저장소가 맞는가"
            exit 1
          fi
          echo "✅ KEEPALIVE_PAT 확인됨 (길이 ${#PAT}자)"

      # ── 1. 체크아웃은 기본 토큰으로. PAT에 의존하지 않는다 ─────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. PAT로 직접 push → 60일 비활성 타이머 리셋 ──────────────────
      - name: 활동 커밋 남기기
        run: |
          set -euo pipefail

          git config user.name  "timesave7"
          git config user.email "timesave7@users.noreply.github.com"

          mkdir -p .github
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/.keepalive

          if git diff --quiet -- .github/.keepalive; then
            git commit --allow-empty -m "chore: keepalive $(date -u '+%Y-%m-%d')"
          else
            git add .github/.keepalive
            git commit -m "chore: keepalive $(date -u '+%Y-%m-%d')"
          fi

          # 인증 정보를 URL에 직접 실어 push (checkout의 자격증명에 의존하지 않음).
          # 혹시라도 로그에 URL이 찍히면 토큰 부분을 가린다.
          git push "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git" \
                   "HEAD:${GITHUB_REF_NAME}" 2>&1 | sed -E 's#https://[^@]*@#https://#g'

          echo "✅ push 완료 — 60일 비활성 타이머 리셋됨"

      # ── 3. 비활성화된 워크플로우 자동 재활성화 (2차 방어) ──────────────
      - name: 꺼진 워크플로우 다시 켜기
        env:
          GH_TOKEN: ${{ secrets.KEEPALIVE_PAT }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state=="disabled_inactivity") | "\(.id)\t\(.name)"' \
            > /tmp/disabled.tsv || true

          if [ -s /tmp/disabled.tsv ]; then
            while IFS=$'\t' read -r id name; do
              echo "재활성화: $name (id=$id)"
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
            done < /tmp/disabled.tsv
          else
            echo "꺼진 워크플로우 없음"
          fi

      # ── 4. 상태 요약을 실행 결과 화면에 표로 출력 ──────────────────────
      - name: 워크플로우 상태 요약
        if: always()
        env:
          GH_TOKEN: ${{ secrets.KEEPALIVE_PAT }}
        run: |
          {
            echo "### 워크플로우 상태"
            echo ""
            echo "| 워크플로우 | 상태 |"
            echo "|---|---|"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
              --jq '.workflows[] | "| \(.name) | \(.state) |"' || echo "| (조회 실패) | - |"
          } >> "$GITHUB_STEP_SUMMARY"
